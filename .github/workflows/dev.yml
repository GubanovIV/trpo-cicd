name: CI Check dev

on:
  push:
    branches:
      - dev

jobs:
  flake8:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8 flake8-pyproject

      - name: Run flake8
        run: flake8 ./app/

  mypy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install mypy
        run: pip install mypy

      - name: Run mypy
        run: |
          find ./app/ -name "*.py" -not -path "./venv/*" -not -path "./.git/*" -not -path "./.github/*" > python_files.txt
          mypy --install-types --non-interactive --strict $(cat python_files.txt)

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Unit test
        run: |
          pytest

  pull-request:
    runs-on: ubuntu-latest
    needs:
      - flake8
      - mypy
      - unit-test
    permissions:
      pull-requests: write
    steps:
      - name: create pull request
        run: gh pr create -B dev -H main --title 'Merge dev into main' --body 'Created by Github action'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}