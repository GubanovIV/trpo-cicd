name: CI Check dev

on:
  push:
    branches:
      - release

jobs:
  flake8:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8 flake8-pyproject

      - name: Run flake8
        run: flake8 ./app/

  mypy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install mypy
        run: pip install mypy

      - name: Run mypy
        run: |
          find ./app/ -name "*.py" -not -path "./venv/*" -not -path "./.git/*" -not -path "./.github/*" > python_files.txt
          mypy --install-types --non-interactive --strict $(cat python_files.txt)

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Unit test
        run: |
          pytest

  docs:
    runs-on: ubuntu-latest
    needs: [unit-test, flake8, mypy]
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v3

    - name: Build HTML
      run: |
        pip install autodocsumm
        ./docs/make.bat html

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: html-docs
        path: docs/build/html/

    - name: Deploy
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/release'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: docs/build/html